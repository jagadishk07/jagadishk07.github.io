const toast=t=>{const e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),1800)};
/* ===== CART MATH ===== */
function T(){let s=0,n=0;for(const i in C){s+=P[i].p*C[i];n+=C[i]}
 const k=K[S.k],okc=k&&s>=k.min;let d=0;
 if(okc)d=k.t=='%'?Math.min(Math.round(s*k.v/100),k.cap):k.t=='f'?k.v:0;
 const pk=n?SHOP.pack:0,sh=n?((s>=SHOP.free||(okc&&k.t=='s'))?0:SHOP.ship):0;
 return{s,n,d,pk,sh,k:okc?S.k:'',t:Math.max(0,s-d)+pk+sh}}
function chg(i,d){const p=P[i];if(p.x)return;C[i]=(C[i]||0)+d;if(C[i]<=0)delete C[i];if(C[i]>99)C[i]=99;save();upd()}
function upd(){const t=T();$('#cn').textContent=t.n;rDrawer();if(['shop','home'].includes(S.v))rMain();if(S.v=='checkout')rMain(true)}
/* ===== COMPONENTS ===== */
const card=p=>{const q=C[p.i]||0,o=Math.round((1-p.p/p.m)*100);
 return`<div class="card${p.x?' oos':''}"><div class="img" style="background:${p.g}">${art(p)}${IMG?`<img src="${IMG}${SL(p.n)}.webp" alt="${esc(p.n)}" loading="lazy" onerror="this.remove()">`:''}<em>${p.e}</em>${p.x?'':`<b class="off">${o}% OFF</b>`}${p.t?`<b class="tag off">${p.t}</b>`:''}</div><h4>${esc(p.n)}</h4><small>${esc(p.u)}</small><div class="pr"><b>${R(p.p)}</b><s>${R(p.m)}</s></div>${p.x?'<button disabled>Out of stock</button>':q?`<div class="st"><button data-a="-" data-i="${p.i}" aria-label="Decrease">−</button><span>${q}</span><button data-a="+" data-i="${p.i}" aria-label="Increase">+</button></div>`:`<button class="add" data-a="+" data-i="${p.i}">Add to cart</button>`}</div>`};
const couponBox=()=>{const t=T(),k=K[S.k];let m='';
 if(S.k&&k)m=t.k?`<div class="msg ok">✔ ${S.k} applied – you saved ${R(t.d)}${k.t=='s'?' on delivery':''}</div>`:`<div class="msg er">${S.k} needs a minimum order of ${R(k.min)} (add ${R(k.min-t.s)} more)</div>`;
 return`<div class="cp"><input id="kin" placeholder="Coupon code" value="${esc(S.k)}" aria-label="Coupon code"><button class="btn" data-a="kap">Apply</button></div>${m}<div class="cc">${Object.keys(K).map(c=>`<span data-a="kuse" data-k="${c}" title="${esc(K[c].d)}">${c}</span>`).join('')}</div>`};
const sumRows=t=>`<div class="row"><span>Subtotal (${t.n} items)</span><span>${R(t.s)}</span></div>${t.d?`<div class="row d"><span>Coupon ${t.k}</span><span>− ${R(t.d)}</span></div>`:''}<div class="row"><span>Packing</span><span>${R(t.pk)}</span></div><div class="row"><span>Delivery</span><span>${t.sh?R(t.sh):'FREE'}</span></div><div class="row t"><span>Total</span><span>${R(t.t)}</span></div>${t.s&&t.s<SHOP.free?`<div class="msg">Add ${R(SHOP.free-t.s)} more for free delivery</div>`:''}`;
/* ===== DRAWER ===== */
function drawer(o){$('#dr').classList.toggle('on',!!o);$('#ov').classList.toggle('on',!!o);document.body.style.overflow=o?'hidden':'';if(o)rDrawer()}
function rDrawer(){const t=T(),ids=Object.keys(C);
 $('#dr').innerHTML=`<div class="dh"><b>🛒 Your Cart (${t.n})</b><button onclick="drawer(0)" aria-label="Close cart">✕</button></div><div class="db">${ids.length?ids.map(i=>{const p=P[i];return`<div class="ci"><div class="e">${p.e}</div><div><b>${esc(p.n)}</b><br><small>${esc(p.u)} · ${R(p.p)}</small><br><button class="rm" data-a="rm" data-i="${i}">Remove</button></div><div class="st"><button data-a="-" data-i="${i}">−</button><span>${C[i]}</span><button data-a="+" data-i="${i}">+</button></div></div>`}).join('')+couponBox():`<div style="text-align:center;padding:50px 10px;color:var(--mu)"><div style="font-size:3rem">🛒</div>Your cart is empty.<br><br><button class="btn" onclick="drawer(0);go('shop')">Browse crackers</button></div>`}</div>${ids.length?`<div class="df">${sumRows(t)}<button class="btn g" style="width:100%;margin-top:8px" onclick="drawer(0);go('checkout')">Proceed to Checkout →</button></div>`:''}`}
/* ===== VIEWS ===== */
function rNav(){$('#nav').innerHTML=`<a class="${S.v=='shop'&&S.cat=='All'?'on':''}" onclick="go('shop','All')">All Crackers</a>`+CN.map(c=>`<a class="${S.v=='shop'&&S.cat==c?'on':''}" onclick="go('shop','${c.replace(/'/g,"\\'")}')">${esc(c)}</a>`).join('');
 $('#ft').innerHTML=['About Us','Contact Us','Shipping Policy','Return Policy','FAQs','Safety Guide','Privacy Policy','Terms of Service'].map(x=>`<a onclick="info('${x}')">${x}</a>`).join('')}
const INFO={'About Us':'Vijay Crackers sells genuine Sivakasi fireworks at up to 80% off MRP.','Contact Us':`Call or WhatsApp us on ${SHOP.phone}.`,'Shipping Policy':`Delivery across Andhra Pradesh in 3–5 working days. Flat packing ${R(SHOP.pack)}, delivery ${R(SHOP.ship)}; free delivery above ${R(SHOP.free)}.`,'Return Policy':'Fireworks cannot be returned once delivered, except for damaged or wrong items reported within 24 hours with photos.','FAQs':'Cash on delivery and online payments are accepted. Orders are confirmed by phone before dispatch.','Safety Guide':'Use outdoors only, keep water nearby, light one cracker at a time, keep children supervised and never relight a dud.','Privacy Policy':'We use your details only to deliver your order.','Terms of Service':'You must be 18+ to purchase. Delivery only where fireworks are legally permitted.'};
const info=x=>alert(x+'\n\n'+INFO[x]);
function rMain(keep){const m=$('#m');let h='';
 if(S.v=='home'){const cb=P.filter(p=>p.c=='Combo Packs');
  h=`<section class="hero"><h1>Buy Crackers &amp; Fireworks Online – Vijay Crackers Sivakasi</h1><p>Genuine Sivakasi crackers at up to 80% off MRP. Sparklers, flower pots, chakkars, sky shots and Diwali combo packs delivered across Andhra Pradesh.</p><button class="btn" onclick="go('shop','All')">Shop all crackers →</button> <button class="btn sec" onclick="go('shop','Combo Packs')">Diwali combo packs</button></section>
  <div class="trust"><div>✅ <b>Genuine Sivakasi</b><br>Direct from manufacturers</div><div>🏷️ <b>Up to 80% off</b><br>Prices vs printed MRP</div><div>🚚 <b>Delivery across AP</b><br>Free above ${R(SHOP.free)}</div><div>🔒 <b>Safe payments</b><br>UPI, cards, net banking, COD</div></div>
  <h2>🎁 Diwali combo packs</h2><div class="grid">${cb.map(card).join('')}</div>
  <h2>Shop by category</h2><div class="tiles">${CN.map(c=>`<div class="tile" style="background:linear-gradient(135deg,${CAT[c][1]})" onclick="go('shop','${c.replace(/'/g,"\\'")}')"><em>${CAT[c][0]}</em>${esc(c)}<br><small>${P.filter(p=>p.c==c).length} items</small></div>`).join('')}</div>
  <p style="text-align:center;margin:20px"><button class="btn" onclick="go('shop','All')">See the full crackers price list</button></p>`}
 else if(S.v=='shop'){let L=P.filter(p=>(S.cat=='All'||p.c==S.cat)&&(!S.q||(p.n+' '+p.c).toLowerCase().includes(S.q.toLowerCase())));
  if(S.sort=='l')L.sort((a,b)=>a.p-b.p);if(S.sort=='h')L.sort((a,b)=>b.p-a.p);if(S.sort=='d')L.sort((a,b)=>(1-b.p/b.m)-(1-a.p/a.m));
  const cats=S.cat=='All'&&!S.q?CN:[S.cat];
  h=`<div class="crumb"><a onclick="go('home')">Home</a> › ${S.cat=='All'?'All Crackers':esc(S.cat)}</div><h2 style="margin-top:0">${S.cat=='All'?'All Crackers':esc(S.cat)} <small style="color:var(--mu);font-weight:400">(${L.length})</small></h2><div class="bar"><div class="chips">${['All',...CN].map(c=>`<a class="${S.cat==c?'on':''}" onclick="go('shop','${c.replace(/'/g,"\\'")}')">${esc(c)}</a>`).join('')}</div><select id="so" aria-label="Sort"><option value="">Sort: Featured</option><option value="l"${S.sort=='l'?' selected':''}>Price: Low to High</option><option value="h"${S.sort=='h'?' selected':''}>Price: High to Low</option><option value="d"${S.sort=='d'?' selected':''}>Biggest discount</option></select></div>`;
  h+=L.length?(S.sort||S.q||S.cat!='All'?`<div class="grid">${L.map(card).join('')}</div>`:cats.map(c=>`<h2>${CAT[c][0]} ${esc(c)}</h2><div class="grid">${L.filter(p=>p.c==c).map(card).join('')}</div>`).join('')):`<div class="box" style="text-align:center">No crackers match “${esc(S.q)}”.</div>`}
 else if(S.v=='checkout')h=rCheckout(keep);
 else if(S.v=='done')h=rDone();
 m.innerHTML=h;const so=$('#so');if(so)so.onchange=e=>{S.sort=e.target.value;rMain()}}
/* ===== CHECKOUT ===== */
function rCheckout(keep){const t=T();
 if(!t.n)return`<div class="box" style="text-align:center;padding:40px"><div style="font-size:3rem">🛒</div><h3>Your cart is empty</h3><br><button class="btn" onclick="go('shop','All')">Browse crackers</button></div>`;
 const c=S.cust,v=k=>esc(c[k]||''),fld=(k,l,ph,ex='')=>`<div class="${ex}"><label for="f_${k}">${l}</label><input id="f_${k}" data-f="${k}" value="${v(k)}" placeholder="${ph}" autocomplete="on"><small id="e_${k}"></small></div>`;
 const dist=['Anantapur','Chittoor','East Godavari','Guntur','Krishna','Kurnool','Nellore','Prakasam','Srikakulam','Visakhapatnam','Vizianagaram','West Godavari','YSR Kadapa','Other'];
 return`<div class="crumb"><a onclick="go('home')">Home</a> › Checkout</div><h2 style="margin-top:0">Checkout</h2><div class="co"><div>
 <div class="box"><h3>1. Delivery details</h3><div class="f">${fld('name','Full name *','Your name')}${fld('phone','Mobile number *','10-digit mobile')}${fld('email','Email (optional)','you@example.com','w')}<div class="w"><label for="f_addr">Delivery address *</label><textarea id="f_addr" data-f="addr" rows="2" placeholder="Door no., street, area, landmark">${v('addr')}</textarea><small id="e_addr"></small></div>${fld('city','Town / City *','Town or city')}${fld('pin','Pincode *','6-digit pincode')}<div><label for="f_dist">District *</label><select id="f_dist" data-f="dist"><option value="">Select district</option>${dist.map(d=>`<option${c.dist==d?' selected':''}>${d}</option>`).join('')}</select><small id="e_dist"></small></div><div><label>State</label><input value="Andhra Pradesh" disabled></div></div></div>
 <div class="box"><h3>2. Payment method</h3><div class="pm">${[['upi','📱 UPI'],['card','💳 Card'],['nb','🏦 Net Banking'],['cod','💵 Cash on Delivery']].map(([k,l])=>`<label><input type="radio" name="pm" value="${k}"${S.pay==k?' checked':''}>${l}</label>`).join('')}</div><div id="pf">${payForm()}</div>
 <div class="note">🧪 Demo storefront: no real money is charged and card details are never saved.</div></div>
 <div class="box"><label style="font-weight:400"><input type="checkbox" id="tc"> I am 18+ years old, I accept the Terms &amp; Safety Guide, and fireworks are permitted at my delivery address. *</label><small id="e_tc" style="color:var(--red)"></small></div></div>
 <div><div class="box" style="position:sticky;top:120px"><h3>Order summary</h3>${Object.keys(C).map(i=>`<div class="row"><span>${P[i].e} ${esc(P[i].n)} × ${C[i]}</span><span>${R(P[i].p*C[i])}</span></div>`).join('')}<hr style="border:0;border-top:1px solid var(--bd);margin:8px 0">${couponBox()}${sumRows(t)}<button class="btn g" id="pay" style="width:100%;margin-top:10px" data-a="pay">${S.pay=='cod'?'Place Order':'Pay '+R(t.t)} →</button></div></div></div>`}
function payForm(){const f=(id,l,ph,m='')=>`<div><label for="${id}">${l}</label><input id="${id}" placeholder="${ph}" ${m}><small id="e_${id}"></small></div>`;
 if(S.pay=='upi')return`<div class="f"><div class="w">${f('upi','UPI ID *','name@upi')}</div></div>`;
 if(S.pay=='card')return`<div class="f"><div class="w">${f('cn_','Card number *','1234 5678 9012 3456','inputmode="numeric" maxlength="23" autocomplete="cc-number"')}</div><div class="w">${f('cnm','Name on card *','As printed on card')}</div>${f('cex','Expiry (MM/YY) *','MM/YY','maxlength="5" autocomplete="cc-exp"')}${f('cvv','CVV *','•••','type="password" inputmode="numeric" maxlength="4"')}</div>`;
 if(S.pay=='nb')return`<div class="f"><div class="w"><label for="bank">Select bank *</label><select id="bank"><option value="">Choose your bank</option>${['State Bank of India','HDFC Bank','ICICI Bank','Axis Bank','Canara Bank','Union Bank of India','Andhra Pradesh Grameena Vikas Bank','Other'].map(b=>`<option>${b}</option>`).join('')}</select><small id="e_bank"></small></div></div>`;
 return`<div class="note">Pay in cash when your order is delivered. Our team will call to confirm the order before dispatch.</div>`}
const luhn=n=>{let s=0,a=0;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(a){d*=2;if(d>9)d-=9}s+=d;a=!a}return s%10==0};
function validate(){const c=S.cust,E={};
 if(!c.name||c.name.trim().length<3)E.name='Enter your full name';
 if(!/^[6-9]\d{9}$/.test((c.phone||'').trim()))E.phone='Enter a valid 10-digit mobile number';
 if(c.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email))E.email='Enter a valid email';
 if(!c.addr||c.addr.trim().length<8)E.addr='Enter your full address';
 if(!c.city||!c.city.trim())E.city='Enter your town or city';
 if(!/^5[0-3]\d{4}$/.test((c.pin||'').trim()))E.pin='Enter a valid Andhra Pradesh pincode';
 if(!c.dist)E.dist='Select your district';
 if(S.pay=='upi'&&!/^[\w.\-]{2,}@[a-z]{2,}$/i.test($('#upi').value.trim()))E.upi='Enter a valid UPI ID (e.g. name@upi)';
 if(S.pay=='card'){const n=$('#cn_').value.replace(/\s/g,''),x=$('#cex').value.match(/^(0[1-9]|1[0-2])\/(\d\d)$/),now=new Date();
  if(!/^\d{13,19}$/.test(n)||!luhn(n))E.cn_='Enter a valid card number';
  if(!$('#cnm').value.trim())E.cnm='Enter the name on card';
  if(!x||new Date(2000+ +x[2],+x[1],0,23,59)<now)E.cex='Enter a valid, unexpired date';
  if(!/^\d{3,4}$/.test($('#cvv').value))E.cvv='Enter the CVV'}
 if(S.pay=='nb'&&!$('#bank').value)E.bank='Select a bank';
 if(!$('#tc').checked)E.tc='Please accept to continue';
 document.querySelectorAll('[id^=e_]').forEach(e=>e.textContent='');document.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'));
 for(const k in E){const e=$('#e_'+k);if(e)e.textContent=E[k];const i=$('#f_'+k)||$('#'+k);if(i)i.classList.add('bad')}
 const first=Object.keys(E)[0];if(first){const i=$('#f_'+first)||$('#'+first)||$('#e_'+first);i&&i.scrollIntoView({behavior:'smooth',block:'center'});if(i&&i.focus)i.focus()}
 return!first}
function placeOrder(){if(!validate())return;const t=T();if(!t.n)return;
 const ord={id:'VC'+Date.now().toString(36).toUpperCase(),date:new Date().toISOString(),cust:{...S.cust},pay:{upi:'UPI',card:'Credit / Debit Card',nb:'Net Banking',cod:'Cash on Delivery'}[S.pay],items:Object.keys(C).map(i=>({n:P[i].n,e:P[i].e,u:P[i].u,q:C[i],p:P[i].p})),t};
 const fin=()=>{$('#sp').classList.remove('on');S.order=ord;try{const o=JSON.parse(localStorage.getItem('vc_orders')||'[]');o.push(ord);localStorage.setItem('vc_orders',JSON.stringify(o.slice(-20)))}catch(e){}C={};S.k='';save();$('#cn').textContent=0;go('done')};
 if(S.pay=='cod')return fin();$('#sp').classList.add('on');setTimeout(fin,1800)}
function rDone(){const o=S.order;if(!o)return`<div class="box">No recent order. <a onclick="go('shop','All')" style="color:var(--navy);cursor:pointer">Continue shopping</a></div>`;
 const eta=new Date(new Date(o.date).getTime()+5*864e5).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}),c=o.cust;
 return`<div class="box done"><div class="tick">✓</div><h2 style="margin:0">Order confirmed!</h2><p>Thank you, ${esc(c.name)}. Your order <b>${o.id}</b> has been placed.</p><p style="color:var(--mu)">${o.pay=='Cash on Delivery'?'Pay '+R(o.t.t)+' in cash on delivery.':'Payment of '+R(o.t.t)+' received via '+o.pay+' (demo).'} Estimated delivery by <b>${eta}</b>.</p></div>
 <div class="co"><div class="box"><h3>Items</h3><table><tr><th>Item</th><th>Qty</th><th>Amount</th></tr>${o.items.map(i=>`<tr><td>${i.e} ${esc(i.n)}<br><small>${esc(i.u)}</small></td><td>${i.q}</td><td>${R(i.p*i.q)}</td></tr>`).join('')}</table>${sumRows(o.t).replace(/<div class="msg">.*?<\/div>/,'')}</div>
 <div><div class="box"><h3>Delivering to</h3><b>${esc(c.name)}</b><br>${esc(c.addr)}<br>${esc(c.city)}, ${esc(c.dist)}<br>Andhra Pradesh – ${esc(c.pin)}<br>📞 ${esc(c.phone)}</div><div class="box noprint"><button class="btn" onclick="window.print()">🖨️ Print receipt</button> <button class="btn sec" onclick="go('shop','All')">Continue shopping</button></div></div></div>`}
/* ===== ROUTING & EVENTS ===== */
function go(v,c){if(v=='checkout'&&!T().n){toast('Your cart is empty');v='shop'}S.v=v;if(c)S.cat=c;if(v=='shop'&&c)S.q='',$('#q').value='';try{history.replaceState(null,'','#'+v)}catch(e){}rNav();rMain();scrollTo({top:0})}
const setK=c=>{c=c.trim().toUpperCase();if(!c){S.k='';return upd()}if(!K[c]){toast('Invalid coupon code');return}S.k=c;const t=T();toast(t.k?'Coupon applied!':'Add '+R(K[c].min-t.s)+' more to use '+c);upd()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
 if(a=='+')chg(i,1);else if(a=='-')chg(i,-1);else if(a=='rm'){delete C[i];save();upd()}
 else if(a=='kap'){const el=b.parentElement.querySelector('input');setK(el.value)}else if(a=='kuse')setK(b.dataset.k);else if(a=='pay')placeOrder()});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){S.cust[f]=e.target.value;e.target.classList.remove('bad')}
 if(e.target.id=='cn_')e.target.value=e.target.value.replace(/[^\d]/g,'').replace(/(.{4})/g,'$1 ').trim();
 if(e.target.id=='cex'){let v=e.target.value.replace(/\D/g,'');if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v}});
document.addEventListener('change',e=>{if(e.target.name=='pm'){S.pay=e.target.value;$('#pf').innerHTML=payForm();const t=T();$('#pay').textContent=(S.pay=='cod'?'Place Order':'Pay '+R(t.t))+' →'}if(e.target.dataset.f)S.cust[e.target.dataset.f]=e.target.value});
$('#q').addEventListener('input',e=>{S.q=e.target.value;if(S.v!='shop'){S.v='shop';S.cat='All';rNav()}rMain()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')drawer(0)});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['home','shop','checkout'].includes(h)&&h!=S.v){S.v=h;rNav();rMain()}});
(function(){const h=location.hash.slice(1);S.v=['home','shop','checkout'].includes(h)?h:'home';if(S.v=='checkout'&&!T().n)S.v='home';rNav();rMain();upd()})();
</script>
